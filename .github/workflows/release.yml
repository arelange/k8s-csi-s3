name: Release

on:
  push:
    tags:
    - "v*"

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Push Docker
      run: (echo '${{ secrets.GITHUB_TOKEN }}' | docker login --username ${{ github.repository_owner }} --password-stdin ghcr.io) && make push

    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
